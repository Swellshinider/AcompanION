name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # no incremental data and no debug info: CI builds once, and both only slow the compile and bloat the cache
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Clippy and the tests are separate jobs so they compile in parallel; each compiles Tauri's dependencies
  # cold the first time, then restores them from the cache that main's runs save.
  clippy:
    name: Clippy
    # Windows: the app targets Windows only and loads Npcap at runtime (the tests that need it are #[ignore]d)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir -p dist/acompanion/browser && echo '<!doctype html>' > dist/acompanion/browser/index.html
        shell: bash
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the frontend folder to exist; the Rust code does not read its content
      - run: mkdir -p dist/acompanion/browser && echo '<!doctype html>' > dist/acompanion/browser/index.html
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm ng test --watch=false

      - name: Build
        run: pnpm ng build

      - name: Translations are up to date
        run: |
          pnpm i18n
          # only the message ids and texts matter: source line numbers drift with every edit
          git diff --exit-code -I'linenumber' -- src/locale/messages.xlf
