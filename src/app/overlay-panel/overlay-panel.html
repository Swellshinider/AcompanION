<section class="box">
  <label class="head">
    <span class="name">
      @switch (view()) {
        @case ('radar') { <ng-container i18n="@@overlayRadar">Radar</ng-container> }
        @case ('meter') { <ng-container i18n="@@overlayMeter">Meter</ng-container> }
        @default { <ng-container i18n="@@overlayDailies">Dailies</ng-container> }
      }
    </span>
    <input class="switch" type="checkbox" role="switch" name="open" [checked]="s().open" (change)="toggle('open', $event)" />
  </label>

  <label class="range">
    <span i18n="@@overlayOpacity">Opacity</span>
    <input type="range" name="opacity" [min]="minOpacity" max="100" step="5" [value]="s().opacity" (input)="opacity($event)" />
    <output>{{ s().opacity }}%</output>
  </label>

  <label class="check">
    <input type="checkbox" name="onTop" [checked]="s().onTop" (change)="toggle('onTop', $event)" />
    <span i18n="@@overlayOnTop">Keep above other windows</span>
  </label>

  <label class="check">
    <input type="checkbox" name="clickThrough" [checked]="s().clickThrough" (change)="toggle('clickThrough', $event)" />
    <span i18n="@@overlayClickThrough">Let clicks pass through</span>
  </label>

  <label class="check">
    <input type="checkbox" name="autoHide" [checked]="s().autoHide" (change)="toggle('autoHide', $event)" />
    <span i18n="@@overlayAutoHide">Hide when the game is closed</span>
  </label>

  @if (view() === 'meter') {
    <label class="check">
      <input type="checkbox" name="hideOutOfCombat" [checked]="s().hideOutOfCombat" (change)="toggle('hideOutOfCombat', $event)" />
      <span i18n="@@overlayHideOutOfCombat">Hide after 10 seconds without combat</span>
    </label>
  }

  @if (failed()) {
    <p class="err" role="alert" i18n="@@overlayFailed">The overlay could not be opened.</p>
  }
</section>
